name: Python wheel preparation
on:
  workflow_dispatch:
  push:
    paths: ['packaging/pypi/**', 'scripts/*wheel*.py', '.github/workflows/wheels.yml', 'README*.md', 'docs/**']
  pull_request:
    paths: ['packaging/pypi/**', 'scripts/*wheel*.py', '.github/workflows/wheels.yml', 'README*.md', 'docs/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r packaging/pypi/requirements-build.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/build_wheels.py --download
      - run: python -m twine check --strict dist/wheels/*.whl
      - run: python scripts/test_wheel_resolution.py
      - name: Check reproducible wheel bytes
        run: |
          python scripts/build_wheels.py --output dist/wheels-repeat
          cmp dist/wheels/SHA256SUMS dist/wheels-repeat/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-candidates
          path: dist/wheels
          retention-days: 7
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-15]
        python: ['3.10', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheel-candidates
          path: dist/wheels
      - run: python -m pip install uv==0.13.1
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/test_wheel_install.py --uv uv --go go
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-install-${{ matrix.os }}-${{ matrix.python }}
          path: .cache/wheel-install-tests/report.json
          retention-days: 7
