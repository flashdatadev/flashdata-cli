name: CLI checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        go: ['1.25.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - run: go mod download
      - run: go mod verify
      - run: python scripts/sync_skills.py --check
      - name: Require D-Bus for headless credential regression tests
        if: runner.os == 'Linux'
        run: command -v dbus-daemon
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-build Apple Silicon
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: go build -trimpath -mod=readonly -o dist/flashdata-darwin-arm64 ./cmd/flashdata
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -short ./...
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - run: go mod download
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: python3 scripts/build_release.py --go go --commit "$(git rev-parse HEAD)"
      - run: python3 scripts/generate_commands.py dist/binaries/flashdata-linux-amd64 --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standalone-release-candidates
          path: dist
          retention-days: 14
  packaged-binaries:
    needs: archives
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: flashdata_1.1.2_linux_amd64.tar.gz
            binary: flashdata
          - os: ubuntu-24.04-arm
            archive: flashdata_1.1.2_linux_arm64.tar.gz
            binary: flashdata
          - os: macos-15-intel
            archive: flashdata_1.1.2_darwin_amd64.tar.gz
            binary: flashdata
          - os: macos-26
            archive: flashdata_1.1.2_darwin_arm64.tar.gz
            binary: flashdata
          - os: windows-latest
            archive: flashdata_1.1.2_windows_amd64.zip
            binary: flashdata.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: standalone-release-candidates
          path: dist
      - name: Verify and extract the archive for this platform
        env:
          RELEASE_ARCHIVE: ${{ matrix.archive }}
        run: python scripts/test_release_archive.py
      - name: Test the extracted release executable against mock APIs
        env:
          FLASHDATA_TEST_BINARY: ${{ github.workspace }}/dist/acceptance/${{ matrix.binary }}
        run: go test ./internal/app
