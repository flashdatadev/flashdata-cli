name: CLI checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        go: ['1.25.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - run: go mod download
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-build Apple Silicon
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: go build -trimpath -mod=readonly -o dist/flashdata-darwin-arm64 ./cmd/flashdata
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -short ./...
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - run: go mod download
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: python3 scripts/build_release.py --go go --commit "$(git rev-parse HEAD)"
      - run: python3 scripts/generate_commands.py dist/binaries/flashdata-linux-amd64 --check
