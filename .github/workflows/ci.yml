name: CLI Apple Silicon release validation
on:
  push:
    branches: [codex/cli-1-4-0-arm-validation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  packaged-binaries-macos-arm64:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c415748407f12af3670c324b389f43b00321f6e0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: 14325933680
          run-id: 44079562636
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Require the original source and archive on a native ARM runner
        run: |
          python3 - <<'PY'
          import hashlib, json, platform, subprocess
          from pathlib import Path
          assert platform.machine() == 'arm64'
          assert subprocess.check_output(['go', 'env', 'GOARCH'], text=True).strip() == 'arm64'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == 'c415748407f12af3670c324b389f43b00321f6e0'
          report = json.loads(Path('dist/releases/build-report.json').read_text())
          assert report['commit'] == 'c415748407f12af3670c324b389f43b00321f6e0'
          assert report['version'] == '1.4.0'
          archive = Path('dist/releases/flashdata_1.4.0_darwin_arm64.tar.gz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '61a27c787a6839242d1e65f753f31b2a126260df50fdf0c6aec6da7ec7dcd7e9'
          PY
      - name: Verify and extract the original release archive
        env:
          RELEASE_ARCHIVE: flashdata_1.4.0_darwin_arm64.tar.gz
        run: python3 scripts/test_release_archive.py
      - name: Test the extracted release executable against mock APIs
        env:
          FLASHDATA_TEST_BINARY: ${{ github.workspace }}/dist/acceptance/flashdata
        run: go test ./internal/app
