[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "flashdata-cli"
version = "1.2.0"
description = "Official FlashData CLI for search, YouTube data, bulk downloads and run recovery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FlashData", email = "support@flashdata.dev" }]
dependencies = []
keywords = ["flashdata", "cli", "search", "youtube", "bulk"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://flashdata.dev"
Documentation = "https://github.com/flashdatadev/flashdata-cli/blob/main/docs/installation.md"
Source = "https://github.com/flashdatadev/flashdata-cli"
Issues = "https://github.com/flashdatadev/flashdata-cli/issues"
Releases = "https://github.com/flashdatadev/flashdata-cli/releases"

[project.scripts]
flashdata = "flashdata_cli:main"

[tool.hatch.build]
reproducible = true

[tool.hatch.build.targets.wheel]
only-include = ["src/flashdata_cli/__init__.py", "src/flashdata_cli/__main__.py"]
sources = ["src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "hatch_build.py", "wheel_support.py", "upstream.json", "README*.md", "LICENSE", "src/flashdata_cli/*.py"]
